version: 2
# Grouped and monthly on purpose: ungrouped weekly updates across this
# fleet would be dozens of PRs a week. One PR per ecosystem per month
# is something a person can actually read.
updates:
  # The real supply-chain surface: these workflows carry signing certs,
  # notarization credentials and publish tokens.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: deps
  - package-ecosystem: npm
    directory: "/openclaw"
    schedule:
      interval: monthly
    groups:
      # ⚠️ Security updates are NOT grouped by default, so a repo with several
      # advisories in one lockfile gets several PRs that all edit it. Merging
      # any one invalidates the rest, `@dependabot recreate` rebuilds them, and
      # the next merge breaks them again. This repo was stuck in that loop.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      production:
        dependency-type: production
      development:
        dependency-type: development
    commit-message:
      prefix: deps
