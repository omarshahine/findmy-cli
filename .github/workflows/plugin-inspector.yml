name: plugin-inspector

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openclaw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          # Exclude cached Node 24 releases below the dev-only OpenClaw minimum.
          node-version: '>=24.22.1 <25'
          cache: npm
          cache-dependency-path: openclaw/package-lock.json
      - run: npm ci --force
      # Typechecks src/index.ts against openclaw's SDK types. This is what makes
      # the dev-only `openclaw` entry in package.json load-bearing -- see the
      # "//" note there before removing either.
      - run: npm run typecheck
      - run: npx @openclaw/plugin-inspector ci --no-openclaw --runtime --mock-sdk --allow-execute
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: plugin-inspector-reports
          path: openclaw/reports/plugin-inspector-*
