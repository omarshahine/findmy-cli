name: plugin-inspector

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openclaw
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openclaw/package-lock.json
      - run: npm ci --force
      # Typechecks src/index.ts against openclaw's SDK types. This is what makes
      # the dev-only `openclaw` entry in package.json load-bearing -- see the
      # "//" note there before removing either.
      - run: npm run typecheck
      - run: npx @openclaw/plugin-inspector ci --no-openclaw --runtime --mock-sdk --allow-execute
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plugin-inspector-reports
          path: openclaw/reports/plugin-inspector-*
